server {
    listen 8080;
    server_name localhost;

    server_tokens off;

    # Security Headers (NFR-SEC-023 & Appendix A.2)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:;" always;

    # Docker embedded DNS resolver for dynamic upstream lookup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Container Healthcheck Endpoint
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 2. Static File Hosting: Admin & Customer Portals (SCRUM-221, Section 10.4)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 3. Static File Hosting: CRL Distribution Point (FR09, Section 9.2, NFR-SEC-005)
    location /crl/ {
        alias /var/www/crl/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    # 4. Reverse Proxy: FastAPI API Gateway + WebSocket Telemetry (FR12, FR14)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        set $api_upstream http://pqca-api-gateway:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live dashboard telemetry (FR14)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. Reverse Proxy: Real-Time OCSP Responder (FR08, NFR-PERF-002)
    location /ocsp/ {
        set $ocsp_upstream http://pqca-ocsp:8001;
        rewrite ^/ocsp/(.*)$ /$1 break;
        proxy_pass $ocsp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
}