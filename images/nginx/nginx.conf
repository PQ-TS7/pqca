worker_processes auto;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Add PKI types not already present in /etc/nginx/mime.types
    types {
        application/pkix-crl        crl;
        application/ocsp-response   ors;
    }

    # Store runtime temp buffers in writable /tmp (NFR-SEC-018 read-only rootfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile   on;
    tcp_nopush on;

    # PQC Sizing (SRS Section 4.5): ML-DSA & composite chains are ~15 KB+
    client_max_body_size    10m;
    client_body_buffer_size 64k;
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # Rate Limiting Zones (NFR-SEC-012)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}