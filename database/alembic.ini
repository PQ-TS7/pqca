# Alembic configuration for the PQ-CA database.
# Run from the repo root:  alembic -c database/alembic.ini <command>
#
# There is no database URL here on purpose: migrations/env.py builds it from
# the PQCA_DB_* environment variables, so no password is ever stored in a file.

[alembic]
script_location = %(here)s/migrations
# 0001_baseline.py, 0002_add_something.py, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
